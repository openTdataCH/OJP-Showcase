map_sql_queries:
  select_calendar_dates_group_by: [APP_PATH]/inc/sql/select_calendar_dates_group_by.sql
  select_stop_times_group_by: [APP_PATH]/inc/sql/select_trips_group_by_stop_times.sql
  update_stop_times_reset: [APP_PATH]/inc/sql/update_stop_times_reset.sql
  select_route_trips_calendar_day_bits: [APP_PATH]/inc/sql/select_route_trips_calendar_day_bits.sql
  create_fts_routes: [APP_PATH]/inc/sql/create_fts_routes.sql

other_config_paths:
  scripts_config: [APP_PATH]/inc/config/scripts-config.yml

gtfs_dbs_base_path: [APP_PATH]/data/gtfs-static-dbs
gtfs_ckan_json_path: [APP_PATH]/data/ckan-utils-tmp/ckan_[PACKAGE_ID].json
gtfs_dbs_json_path: [APP_PATH]/data/gtfs-static-dbs/gtfs-static-dbs.json

gtfs_rt_updates:
  -
    # up to 10.04 the GTFS-RT switch was done at 13:05 in the day of GTFS static publish
    to: "2024-04-10"
    switch: "13:05"
  -
    # up to LATE-LATE the GTFS-RT switch was done at 15:05
    to: "2099-12-31"
    switch: "15:05"
